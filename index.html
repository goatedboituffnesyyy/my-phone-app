<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PayPal - Accounts</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="mobile-wrapper">
    <!-- Top Header Bar -->
    <header class="top-nav">
      <button class="icon-circle-btn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0070BA" stroke-width="2.2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="header-right">
        <button class="icon-circle-btn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0070BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>

        <div class="avatar-ring">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Profile" />
        </div>
      </div>
    </header>

    <!-- Scrollable Main Content -->
    <main class="content-body">
      <!-- Title -->
      <h1 class="page-title">Accounts</h1>

      <!-- Top Pills / Chips Carousel -->
      <section class="chips-scroll">
        <button class="chip">Add banks and cards</button>
        <button class="chip">Add cash at stores</button>
        <button class="chip">Cash a check</button>
      </section>

      <!-- PayPal Balance Card -->
      <div class="account-card">
        <div class="account-card-body">
          <span class="sub-label">PayPal balance</span>
          <div class="balance-number">$0.00</div>
          <span class="available-text">Available balance</span>

          <!-- 3 Actions: Add Money, Transfer, Account Info -->
          <div class="actions-row">
            <div class="action-btn">
              <div class="action-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0c2340" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                  <circle cx="12" cy="12" r="2.5"></circle>
                  <path d="M6 12h.01M18 12h.01"></path>
                </svg>
              </div>
              <span>Add Money</span>
            </div>

            <div class="action-btn">
              <div class="action-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0c2340" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m7 16-4-4 4-4"></path>
                  <path d="m17 8 4 4-4 4"></path>
                  <path d="M3 12h18"></path>
                </svg>
              </div>
              <span>Transfer</span>
            </div>

            <div class="action-btn">
              <div class="action-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0c2340" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="16" x2="12" y2="12"></line>
                  <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
              </div>
              <span>Account Info</span>
            </div>
          </div>
        </div>

        <!-- Cyan Bottom Banner with Mini Debit Card -->
        <div class="cyan-banner">
          <p>Get the PayPal Debit Card and earn 5% cash back in a monthly category you choose</p>
          <div class="mini-card-graphic">
            <span class="mini-paypal-logo">PayPal</span>
            <div class="mc-circles">
              <span class="red-circle"></span>
              <span class="yellow-circle"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Rewards Section -->
      <section class="section-rewards">
        <h2 class="section-title">Rewards</h2>
        <div class="rewards-card">
          <div class="rewards-info">
            <div class="rewards-points">0 pts</div>
            <div class="rewards-sub">$0.00 cash back redemption value</div>
          </div>
          <a href="#" class="ways-to-earn">Ways to earn</a>
        </div>
      </section>

      <!-- Peeking Bottom Section -->
      <section class="peeking-footer-section">
        <h2 class="section-title">Pay with convenience and flexibility</h2>
      </section>
    </main>

    <!-- Bottom Navigation Bar (Accounts Tab Active) -->
    <nav class="bottom-nav">
      <button class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </button>

      <!-- ACTIVE TAB -->
      <button class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="14" rx="3"></rect>
          <path d="M16 13a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path>
        </svg>
        <span>Accounts</span>
      </button>

      <div class="nav-center">
        <button class="send-request-btn" aria-label="Send or Request">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="8 6 8 18"></polyline>
            <polyline points="4 10 8 6 12 10"></polyline>
            <polyline points="16 18 16 6"></polyline>
            <polyline points="12 14 16 18 20 14"></polyline>
          </svg>
        </button>
        <span class="center-label">Send/Request</span>
      </div>

      <button class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          <line x1="8" y1="9" x2="16" y2="9"></line>
          <line x1="8" y1="13" x2="14" y2="13"></line>
        </svg>
        <span>Activity</span>
      </button>

      <button class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>Offers</span>
      </button>
    </nav>
  </div>
</body>
</html>
